name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A safety net, not the delivery mechanism. divejson/divejson triggers this
    # workflow itself once a schema change passes conformance there, so the
    # schema normally reaches the site in about a minute. That trigger runs on a
    # GitHub App, and if the App is ever uninstalled or has its permission
    # revoked the dispatch fails over there - silently, from this repository's
    # point of view, since nothing here would report it. This rebuild is what
    # stops that turning into a site that has quietly stopped tracking the spec.
    # Daily rather than weekly so the undetected window is a day, not a week.
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # Tolerate the spec repository being empty pre-seed.
        continue-on-error: true
        with:
          repository: divejson/divejson
          path: _spec
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html favicon.svg favicon.ico apple-touch-icon.png _site/
          if [ -d _spec/schema ]; then
            cp -r _spec/schema _site/schema
          else
            echo "::notice::spec repository carries no schema yet; site ships without /schema"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
